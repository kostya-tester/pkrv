name: Build Bench Manager EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE
      shell: cmd
      run: |
        pyinstaller --onefile --windowed --name "BenchManager" --add-data "gui/images;gui/images" --add-data "config.yaml;." --hidden-import paramiko main.py
    
    - name: Check EXE
      shell: cmd
      run: |
        if exist "dist\BenchManager.exe" (echo EXE OK) else (echo EXE FAIL && exit 1)
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: BenchManager-Windows
        path: dist\BenchManager.exe
        retention-days: 30
