name: Build Bench Manager EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE
      shell: cmd
      run: |
        pyinstaller --onefile --windowed --name "BenchManager" --add-data "core/*.py;core" --add-data "logger/*.py;logger" --add-data "gui/*.py;gui" --add-data "gui/images;gui/images" --add-data "scripts;scripts" --add-data "config.yaml;." --hidden-import bench_connector --hidden-import file_transfer --hidden-import file_manager --hidden-import process_manager --hidden-import board_interface --hidden-import log_manager --hidden-import main_window main.py
    
    - name: Check EXE
      shell: cmd
      run: |
        if exist "dist\BenchManager.exe" (echo EXE OK) else (echo EXE FAIL && exit 1)
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: BenchManager-Windows
        path: dist/BenchManager.exe
        retention-days: 30
