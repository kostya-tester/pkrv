name: Build Bench Manager EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        node-version: '24'
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Download plink.exe
      shell: cmd
      run: |
        curl -L -o plink.exe https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe
        dir plink.exe
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5
    
    - name: Build EXE
      shell: cmd
      run: |
        pyinstaller --onefile --windowed --name "BenchManager" --add-data "gui/images;gui/images" --add-data "config.yaml;." --add-binary "plink.exe;." main.py
    
    - name: Check EXE
      shell: cmd
      run: |
        if exist "dist\BenchManager.exe" (echo EXE OK) else (echo EXE FAIL && exit 1)
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: BenchManager-Windows
        path: dist/BenchManager.exe
        retention-days: 30
