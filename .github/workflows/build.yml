name: Build Bench Manager EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5
    
    - name: Build EXE with images
      shell: cmd
      run: |
        pyinstaller --onefile --windowed --name "BenchManager" --add-data "gui/images;gui/images" main.py
    
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: BenchManager
        path: dist/BenchManager.exe
        retention-days: 30
